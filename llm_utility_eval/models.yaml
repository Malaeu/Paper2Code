    context_window: 1048576  # Exact: 1,048,576 input tokens, 65,536 output
    multimodal_support:
      text:
        input_cost: 0.15  # per 1M tokens
        output_cost: 0.60
      audio:
        input_cost: 1.00  # per 1M tokens (25 tokens/second)
        tokens_per_second: 25
      image:
        tokens_per_1024x1024: 1290  # scales with resolution
      video:
        tokens_per_second: 258  # at 1fps
    thinking_capabilities:
      enabled: true
      max_budget: 24576  # tokens
      output_cost_with_thinking: 3.50  # per 1M tokens (5.8x premium)
    
